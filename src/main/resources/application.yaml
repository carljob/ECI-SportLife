spring:

  # ─── Persistencia Relacional (H2 en memoria) ───────────────────────
  datasource:
    url: jdbc:h2:mem:sportlife;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # crea tablas al arrancar, las elimina al cerrar
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console    # http://localhost:8080/h2-console

  # ─── Persistencia No Relacional (MongoDB) ──────────────────────────
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/sportlife}
      # En CI/CD se sobreescribe con la variable de entorno MONGO_URI

# ─── Documentación OpenAPI / Swagger UI ───────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha

# ─── Servidor ─────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  error:
    include-message: always    # muestra el mensaje en los errores 4xx/5xx
